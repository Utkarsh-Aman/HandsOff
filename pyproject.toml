[project]
name = "handsoff"
version = "0.1.0"
description = "Control the desktop cursor with hand gestures from a webcam (MediaPipe + OpenCV + pyautogui)"
readme = "README.md"
authors = [
    { name = "Utkarsh-Aman", email = "utkarsh4aman@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mediapipe>=1.0.1",
    "opencv-python>=5.0.0.93",
    "pyautogui>=0.9.54",
]

[project.scripts]
handsoff = "handsoff.main:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
